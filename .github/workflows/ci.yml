name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (mvn verify)
        run: mvn -B verify

      # The test suite runs on H2 in PostgreSQL-compatibility mode so CI needs
      # no database service; the same Flyway migrations run against real
      # PostgreSQL 16 in local development via docker-compose.yml.
      - name: Validate docker-compose file
        run: docker compose config --quiet
