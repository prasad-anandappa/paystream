spring:
  datasource:
    url: jdbc:h2:mem:paystream-api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

# Keep scheduled jobs effectively off during tests; endpoints are invoked directly.
paystream:
  outbox:
    fixed-delay-ms: 3600000
  recon:
    fixed-delay-ms: 3600000
