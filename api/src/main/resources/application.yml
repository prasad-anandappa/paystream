spring:
  application:
    name: paystream
  datasource:
    # Local development defaults match docker-compose.yml; override with env vars anywhere else.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paystream}
    username: ${DB_USERNAME:paystream}
    password: ${DB_PASSWORD:paystream}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

paystream:
  outbox:
    fixed-delay-ms: 5000
  recon:
    fixed-delay-ms: 300000
